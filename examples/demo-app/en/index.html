<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo shop</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top" data-testid="top">
      <span class="logo" data-testid="logo">Miraya</span>
      <a href="#" data-testid="shop">Shop</a>
      <button class="cart" data-testid="cart">Cart</button>
    </header>
    <main class="card" data-testid="card">
      <h1 data-testid="name">Brass desk lamp</h1>
      <p class="price" data-testid="price">EGP 450</p>
      <button data-testid="add">Add to cart</button>
    </main>
  </body>
</html>
