# Copy to .github/workflows/miraya.yml in your app's repository.
# Builds the app, serves it, and fails the pull request on new RTL errors.
# Findings appear as annotations and in the job summary; the HTML report is an artifact.
name: RTL audit

on:
  pull_request:

permissions:
  contents: read
  # For the summary comment on the pull request.
  pull-requests: write

jobs:
  miraya:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Playwright image pins system fonts, so baselines stay stable between runs.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Serve the production build; dev servers inject overlays that aren't your app.
      - run: npm run preview -- --port 3000 &
      - run: npx wait-on http://localhost:3000
      # Annotations and the job summary are added automatically on GitHub Actions.
      - run: npx miraya audit
      # One comment per pull request, edited on each push: new, fixed and known per area.
      - uses: marocchino/sticky-pull-request-comment@v2
        if: always() && hashFiles('.miraya/pr-comment.md') != ''
        with:
          header: miraya
          path: .miraya/pr-comment.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: miraya-report
          path: .miraya/
          # .miraya/ starts with a dot; upload-artifact skips hidden files by default.
          include-hidden-files: true
