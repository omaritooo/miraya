<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up</title>
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/form.css" />
  </head>
  <body>
    <main data-testid="main">
      <form class="form" data-testid="form">
        <label data-testid="phone-label"
          >Phone<input type="tel" data-testid="phone" dir="ltr"
        /></label>
        <label data-testid="email-label"
          >Email<input type="email" data-testid="email" dir="ltr"
        /></label>
        <label data-testid="name-label"
          >Full name<input type="text" name="fullname" data-testid="name"
        /></label>
        <label data-testid="otp-label"
          >Code<input autocomplete="one-time-code" inputmode="numeric" data-testid="otp" dir="ltr"
        /></label>
      </form>
    </main>
  </body>
</html>
