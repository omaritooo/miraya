<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop</title>
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/shop.css" />
  </head>
  <body>
    <main data-testid="main">
      <h1 data-testid="heading">Shop</h1>
      <p data-testid="promo">Free shipping on all orders</p>
      <div class="grid" data-testid="grid">
        <article class="card" data-testid="card-1">
          <h2 data-testid="name-1">Desk lamp</h2>
          <p data-testid="price-1">EGP 450</p>
          <button data-testid="add-1">Add to cart</button>
        </article>
        <article class="card" data-testid="card-2">
          <h2 data-testid="name-2">Notebook</h2>
          <p data-testid="price-2">EGP 60</p>
          <button data-testid="add-2">Add to cart</button>
        </article>
        <article class="card" data-testid="card-3">
          <h2 data-testid="name-3">Backpack</h2>
          <p data-testid="price-3">EGP 900</p>
          <button data-testid="add-3">Add to cart</button>
        </article>
      </div>

      <p data-testid="brand">Miraya Visa</p>
      <p data-testid="contact">help@miraya.dev</p>
      <p data-testid="docs">https://miraya.dev/rules</p>
      <pre data-testid="install"><code data-testid="install-code">npm install miraya</code></pre>
      <p data-testid="model">
        Model: <span dir="ltr" data-testid="model-name">Lumen Desk Pro</span>
      </p>
    </main>
  </body>
</html>
