<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edge cases</title>
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/not-mirrored.css" />
  </head>
  <body>
    <main class="stage" data-testid="stage">
      <div class="modal" data-testid="modal">
        <h2 data-testid="modal-title">Delete order?</h2>
        <p data-testid="modal-body">This can't be undone.</p>
      </div>
      <div class="spread" data-testid="spread">
        <span data-testid="cell-1">Subtotal</span
        ><span data-testid="cell-2">Free shipping today</span
        ><span data-testid="cell-3">Total</span>
      </div>
      <pre class="snippet" dir="ltr" data-testid="snippet">GET /api/orders</pre>
    </main>
    <button
      class="chat"
      data-testid="chat"
      data-rtl-ignore="not-mirrored: brand rule, the chat launcher stays bottom-right"
    >
      Chat
    </button>
  </body>
</html>
