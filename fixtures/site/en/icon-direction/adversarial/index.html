<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edge cases</title>
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/icons.css" />
  </head>
  <body>
    <main class="toolbar" data-testid="toolbar">
      <button data-testid="btn-1">
        <svg
          data-testid="resize"
          class="lucide lucide-move-horizontal"
          data-icon="arrow-left-right"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="18 8 22 12 18 16" />
          <polyline points="6 8 2 12 6 16" />
          <line x1="2" x2="22" y1="12" y2="12" /></svg
        ><span data-testid="label-1">Resize</span></button
      ><button data-testid="btn-2">
        <svg
          data-testid="send"
          class="lucide lucide-send"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14.5 21.7a.5.5 0 0 0 .9 0L22 3.5a.5.5 0 0 0-.6-.6L3.3 9.6a.5.5 0 0 0 0 .9l7.6 3.1a2 2 0 0 1 1.1 1.1z"
          />
          <path d="m21.9 2.1-10.9 10.9" /></svg
        ><span data-testid="label-2">Send</span>
      </button>
    </main>
  </body>
</html>
