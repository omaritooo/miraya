<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Player</title>
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/icons.css" />
  </head>
  <body>
    <main class="toolbar" data-testid="toolbar">
      <button data-testid="btn-1">
        <svg
          data-testid="back"
          class="lucide lucide-chevron-left flip-rtl"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6" /></svg
        ><span data-testid="label-1">Back</span></button
      ><button data-testid="btn-2">
        <svg
          data-testid="next"
          class="lucide lucide-chevron-right"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m9 18 6-6-6-6" /></svg
        ><span data-testid="label-2">Next</span></button
      ><button data-testid="btn-3">
        <svg
          data-testid="play"
          class="lucide lucide-play"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="6 3 20 12 6 21 6 3" /></svg
        ><span data-testid="label-3">Play</span></button
      ><button data-testid="btn-4">
        <svg
          data-testid="logout"
          class="lucide lucide-log-out flip-rtl"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" x2="9" y1="12" y2="12" /></svg
        ><span data-testid="label-4">Log out</span>
      </button>
    </main>
  </body>
</html>
