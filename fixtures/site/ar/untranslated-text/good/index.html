<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>المتجر</title>
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/shop.css" />
  </head>
  <body>
    <main data-testid="main">
      <h1 data-testid="heading">المتجر</h1>
      <p data-testid="promo">شحن مجاني لكل الطلبات</p>
      <div class="grid" data-testid="grid">
        <article class="card" data-testid="card-1">
          <h2 data-testid="name-1">مصباح مكتب</h2>
          <p data-testid="price-1">450 ج.م</p>
          <button data-testid="add-1">أضف إلى السلة</button>
        </article>
        <article class="card" data-testid="card-2">
          <h2 data-testid="name-2">دفتر</h2>
          <p data-testid="price-2">60 ج.م</p>
          <button data-testid="add-2">أضف إلى السلة</button>
        </article>
        <article class="card" data-testid="card-3">
          <h2 data-testid="name-3">حقيبة ظهر</h2>
          <p data-testid="price-3">900 ج.م</p>
          <button data-testid="add-3">أضف إلى السلة</button>
        </article>
      </div>

      <p data-testid="brand">Miraya Visa</p>
      <p data-testid="contact">help@miraya.dev</p>
      <p data-testid="docs">https://miraya.dev/rules</p>
      <pre data-testid="install"><code data-testid="install-code">npm install miraya</code></pre>
      <p data-testid="model">
        الطراز: <span dir="ltr" data-testid="model-name">Lumen Desk Pro</span>
      </p>
    </main>
  </body>
</html>
