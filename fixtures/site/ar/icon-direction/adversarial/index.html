<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>حالات خاصة</title>
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/icons.css" />
  </head>
  <body>
    <main class="toolbar" data-testid="toolbar">
      <button data-testid="btn-1">
        <svg
          data-testid="resize"
          class="lucide lucide-move-horizontal"
          data-icon="arrow-left-right"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="18 8 22 12 18 16" />
          <polyline points="6 8 2 12 6 16" />
          <line x1="2" x2="22" y1="12" y2="12" /></svg
        ><span data-testid="label-1">تغيير الحجم</span></button
      ><button data-testid="btn-2">
        <svg
          data-testid="send"
          class="lucide lucide-send"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="20" height="16" x="2" y="4" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg
        ><span data-testid="label-2">إرسال</span>
      </button>
    </main>
  </body>
</html>
