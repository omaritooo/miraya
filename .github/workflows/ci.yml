name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    # A hung browser test must fail the build, not run until the default 6-hour limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # The development toolchain (pnpm 11) needs Node 22.13+. The published packages
      # still support Node 20, which the node20 job below checks.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Before typecheck: @miraya/playwright type-checks against miraya's build output.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter miraya exec playwright install --with-deps chromium
      # The precision suite: every fixture page must produce exactly its labelled findings.
      - run: pnpm --filter miraya test:e2e
      # The Playwright helper, run by Playwright's own test runner against the fixture site.
      - run: pnpm --filter @miraya/playwright test

  node20:
    name: Built CLI runs on Node 20
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter miraya build
      - run: pnpm --filter miraya exec playwright install --with-deps chromium
      # Everything from here runs on Node 20, as a user of the published package would.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --version
      - name: Serve the fixture site
        working-directory: fixtures/site
        run: |
          nohup node node_modules/vite/bin/vite.js --port 4317 --strictPort > /tmp/site.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4317/en/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/site.log
          exit 1
      - name: Audit bad pages with the CLI
        run: |
          mkdir -p "$RUNNER_TEMP/node20" && cd "$RUNNER_TEMP/node20"
          cat > miraya.config.mjs <<'EOF'
          export default {
            baseUrl: 'http://localhost:4317',
            routes: ['/not-mirrored/bad', '/icon-direction/bad'],
            locale: { strategy: 'path-prefix', ltr: '/en', rtl: '/ar' },
          }
          EOF
          set +e
          node "$GITHUB_WORKSPACE/packages/miraya/dist/cli.js" audit --format json,html
          code=$?
          set -e
          # The bad pages must fail with exit 1 (new errors), not 2 (a crash).
          test "$code" -eq 1
          test -s .miraya/report.json
          test -s .miraya/report.html
