name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # A hung browser test must fail the build, not run until the default 6-hour limit.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter miraya exec playwright install --with-deps chromium
      # The precision suite: every fixture page must produce exactly its labelled findings.
      - run: pnpm --filter miraya test:e2e
      # The Playwright helper, run by Playwright's own test runner against the fixture site.
      - run: pnpm --filter @miraya/playwright test
