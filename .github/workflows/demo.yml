name: Demo RTL audit

# Runs Miraya, built from this repo, on the demo app in examples/demo-app.
# On a pull request that breaks the Arabic layout, the job fails with annotations
# and a job summary, and the HTML report is uploaded as an artifact.
on:
  pull_request:
    paths:
      - examples/demo-app/**
      - packages/miraya/**
      - .github/workflows/demo.yml

permissions:
  contents: read

jobs:
  miraya:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @miraya/cli build
      - run: pnpm --filter @miraya/cli exec playwright install --with-deps chromium
      - name: Serve the demo app
        run: |
          nohup pnpm --filter @miraya/demo-app serve > /tmp/demo-app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4400/en/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/demo-app.log
          exit 1
      # Annotations and the job summary are added automatically on GitHub Actions.
      - name: Audit with Miraya
        working-directory: examples/demo-app
        run: pnpm miraya
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: miraya-report
          path: examples/demo-app/.miraya/
          # .miraya/ starts with a dot; upload-artifact skips hidden files by default.
          include-hidden-files: true
